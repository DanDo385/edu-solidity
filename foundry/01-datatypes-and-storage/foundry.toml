[profile.default]
src = "src"
out = "out"
libs = ["../lib"]
test = "test"
script = "script"

# Both skeleton and solution test files are enabled
# The skeleton tests validate your implementation (src/DatatypesStorage.sol)
# The solution tests validate the reference (src/solution/DatatypesStorageSolution.sol)

remappings = [
    "forge-std/=../lib/forge-std/src/"
]

solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
